<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Aurelle Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header" class="min-h-[96px]"></header>

  <main>
    <section class="bg-gradient-to-br from-blush-100 via-cream to-sand">
      <div class="container-x py-8 text-center sm:py-10">
        <nav class="text-xs uppercase tracking-widest text-plum/60"><a href="index.html" class="hover:text-blush-600">Home</a> / <a href="cart.html" class="hover:text-blush-600">Bag</a> / <span class="text-plum">Checkout</span></nav>
        <h1 class="mt-3 text-3xl font-medium sm:text-4xl">Secure checkout</h1>
      </div>
    </section>

    <section class="container-x py-8 sm:py-10">
      <div id="checkout-root"></div>
    </section>
  </main>

  <!-- success modal -->
  <div id="success" class="invisible fixed inset-0 z-[90] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" role="dialog" aria-modal="true" aria-labelledby="success-title">
    <div class="absolute inset-0 bg-plum/70 backdrop-blur-md"></div>
    <div class="relative w-full max-w-md scale-90 rounded-2xl bg-white p-5 text-center shadow-2xl transition-transform duration-500" id="success-box">
      <div class="mx-auto flex h-20 w-20 animate-pop items-center justify-center rounded-full bg-gradient-to-br from-blush-400 to-blush-600 text-white shadow-soft"><svg class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
      <h2 id="success-title" class="mt-6 text-2xl font-medium">Order placed!</h2>
      <p class="mt-3 text-plum/70">Thank you, <b id="s-name"></b>. Your order <b id="s-id" class="text-blush-600"></b> is confirmed and will arrive in 2–5 business days.</p>
      <a href="index.html" class="btn btn-primary mt-6 w-full">Back to home</a>
      <a href="shop.html" class="mt-4 inline-block text-sm font-semibold link-u">Continue shopping</a>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
